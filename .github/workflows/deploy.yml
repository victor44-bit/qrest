name: Deploy on push to main

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout (for metadata only)
        uses: actions/checkout@v4

      - name: Add server host to known_hosts (avoids SSH prompt)
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: SSH into server, pull, build, reload
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail
            cd /var/www/qrest
            git fetch --all --prune
            git reset --hard origin/main
            npm ci
            npm run build
            pm2 startOrReload ecosystem.config.js
            pm2 save
            curl -s -o /dev/null -w "local:%{http_code} size:%{size_download}\n" http://127.0.0.1:3000/
