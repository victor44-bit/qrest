name: SSH Smoke Test
on: workflow_dispatch
jobs:
  ssh:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnostics (are secrets set?)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY:  ${{ secrets.SSH_KEY }}
        run: |
          echo "HOST len: ${#SSH_HOST}"
          echo "USER len: ${#SSH_USER}"
          echo "PORT val: ${SSH_PORT:-<empty>}"
          echo "KEY  len: ${#SSH_KEY}"

      - name: Write private key to file
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          # Write the secret EXACTLY as provided (multiline)
          cat > ~/.ssh/gha_actions <<'EOF'
${SSH_KEY}
EOF
          chmod 600 ~/.ssh/gha_actions
          # Show first/last lines so we know formatting survived (no content leak)
          head -n1 ~/.ssh/gha_actions
          tail -n1 ~/.ssh/gha_actions

      - name: Test SSH with OpenSSH client
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          # add host key so StrictHostKeyChecking doesn't block
          ssh-keyscan -p "${SSH_PORT:-22}" "${SSH_HOST}" >> ~/.ssh/known_hosts
          # run a simple command
          ssh -vvv -i ~/.ssh/gha_actions -p "${SSH_PORT:-22}" \
              -o IdentitiesOnly=yes \
              -o PreferredAuthentications=publickey \
              "${SSH_USER}@${SSH_HOST}" 'echo connected && whoami && hostname && ls -la /var/www/qrest' || {
            echo "OpenSSH failed — check the -vvv log above."; exit 1;
          }
